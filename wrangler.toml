name = "dr4fter"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# Pages "advanced mode": public/_worker.js is a directory-based Worker (its
# index.js is the entry point, and it imports room-do.js/engine.js/gamedata.js
# as siblings, unchanged from the plain-Worker layout). Pages runs it for
# every request and hands it an ASSETS binding automatically to fall back to
# the static files sitting next to it — no [assets] block needed here, that
# was Worker-only config.

# one Durable Object per room — strongly consistent, requests handled one at a
# time, which removes the whole class of race conditions the Netlify build had
# to defend against with ETags and retries.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# permanent snapshots for /r/<id> share links
# Created via the Cloudflare connector (namespace "dr4fter-results") since
# the previous account's namespaces were lost along with it.
[[kv_namespaces]]
binding = "RESULTS"
id = "97a339b8cdc4427297c6375b9d18dca9"

# shared AI-learning data (namespace "dr4fter-aiprefs")
[[kv_namespaces]]
binding = "AIPREFS"
id = "f1ba569d6c864094a4ac691375d0e0c5"

# Cloudflare Workers AI — powers the "picture it" image on the results screen.
# No API key: the binding is the auth.
[ai]
binding = "AI"

# Real-time logs — this is what lets you (or me, via a screenshot) see the
# actual server-side error the moment something goes wrong, instead of
# guessing from a symptom on screen.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
