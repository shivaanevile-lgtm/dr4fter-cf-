name = "dr4fter"
main = "src/index.js"
compatibility_date = "2025-01-01"

# static files (index.html) are served from ./public
[assets]
directory = "./public"
binding = "ASSETS"

# one Durable Object per room
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# permanent snapshots for /r/<id> share links
[[kv_namespaces]]
binding = "RESULTS"
id = "401bab22bf0d4e478947362f7ce796ec"

# shared AI-learning data
[[kv_namespaces]]
binding = "AIPREFS"
id = "dab78dec8d0f4c54b983855715c5d67f"
