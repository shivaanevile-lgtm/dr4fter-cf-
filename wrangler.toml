name = "dr4fter"
main = "src/index.js"
compatibility_date = "2025-01-01"

# static files (index.html) are served from ./public
[assets]
directory = "./public"
binding = "ASSETS"

# one Durable Object per room — strongly consistent, requests handled one at a
# time, which removes the whole class of race conditions the Netlify build had
# to defend against with ETags and retries.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# permanent snapshots for /r/<id> share links
[[kv_namespaces]]
binding = "RESULTS"
id = "401bab22bf0d4e478947362f7ce796ec"

# shared AI-learning data
[[kv_namespaces]]
binding = "AIPREFS"
id = "dab78dec8d0f4c54b983855715c5d67f"

# Cloudflare Workers AI — powers the "picture it" image on the results screen.
# No API key: the binding is the auth.
[ai]
binding = "AI"

# Real-time logs — this is what lets you (or me, via a screenshot) see the
# actual server-side error the moment something goes wrong, instead of
# guessing from a symptom on screen.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
